[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "clipppy"
description = "Convenience Layer for Inference and Probabilistic Programming in Python"
authors = [{name = "Kosio Karchev", email = "kosiokarchev@gmail.com"}]

readme = "README.md"
license = {text = "GPLv3"}

classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Typing :: Typed"
]

requires-python = ">=3.9"

dependencies = [
    "apipkg",
    "deprecated",
    "frozendict",
    "more-itertools",
    "typing-extensions",
    "ruamel.yaml>=0.17.29",
    "python-forge",
    "pyro-ppl<1.9.0",
    "torch>=1.11",
    "pytorch-lightning",
    "phytorchx"
]

dynamic = ["version"]

[project.urls]
"GitHub" = "https://github.com/kosiokarchev/clipppy"
"Read the Docs" = "https://clipppy.readthedocs.org/"

[project.optional-dependencies]
docs = ["sphinx-autoapi"]
testing = ["pytest", "hypothesis", "scipy"]
all = ["jinja2", "pytorch_lightning", "tensorboard", "wandb", "emcee", "zarr", "netCDF4", "torchdata", "corner"]
jinja = ["jinja2"]
lightning = ["pytorch_lightning", "tensorboard", "wandb"]
emcee = ["emcee"]
zarr = ["zarr"]
netcdf = ["netCDF4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
src = ["**/*.pyi"]

[tool.setuptools_scm]
version_file = "src/clipppy/_version.py"
version_scheme = "no-guess-dev"

[tool.pytest]
testpaths = "tests"
